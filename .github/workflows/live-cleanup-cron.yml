name: Scheduled Live Match Cleanup Cron
on:
  schedule:
    # Jornadas de tarde/noche en Ushuaia (12:00 a 20:59 hs local = 15:00 a 23:59 UTC los Viernes, Sábados y Domingos)
    - cron: '*/30 15-23 * * 5,6,0'
    # Cierre nocturno y madrugada en Ushuaia (21:00 a 00:30 hs local = 00:00 a 03:30 UTC los Sábados, Domingos y Lunes)
    - cron: '*/30 0-3 * * 6,0,1'
  workflow_dispatch:

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Live Cleanup Endpoint
        run: |
          if [ -z "${{ secrets.APP_URL }}" ]; then
            echo "::warning::secrets.APP_URL no está configurado en GitHub Secrets. Se omite la ejecución para mantener el build en verde."
            exit 0
          fi
          curl --fail -sS -X GET "${{ secrets.APP_URL }}/api/cron/live-cleanup" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}"
