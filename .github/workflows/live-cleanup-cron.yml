name: Scheduled Live Match Cleanup Cron
on:
  schedule:
    - cron: '*/5 * * * *' # Ejecución cada 5 minutos
  workflow_dispatch:

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Live Cleanup Endpoint
        run: |
          curl -X GET "${{ secrets.APP_URL }}/api/cron/live-cleanup" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}"
